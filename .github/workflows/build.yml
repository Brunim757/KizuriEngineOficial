name: Build Kizuri Engine


permissions:
  contents: write

on:
  
  workflow_dispatch:
  
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-latest
            preset: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools \
            xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libx11-dev libasound2-dev libssl-dev ninja-build zip

      - name: Instalar Ninja (Windows)
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache do FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-kizuri-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-kizuri-deps-

      - name: Cache de compilação (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "1G"
          key: ${{ matrix.os }}

      - name: Configurar .NET SDK 10 (binding pré-compilado)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      
      
      - name: Compilar binding (Kizuri.Scripting.dll)
        shell: bash
        run: |
          dotnet build managed/Kizuri.Scripting/Kizuri.Scripting.csproj \
            -c Release --nologo -o managed

      - name: Baixar assets de demonstração (embutir no exe)
        shell: bash
        run: |
          set +e
          mkdir -p demo_content/models
          base="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0"
          dl() { curl -fsSL --max-time 60 -o "$2" "$1" 2>/dev/null; [ -s "$2" ] || rm -f "$2"; }
          dl "$base/Fox/glTF-Binary/Fox.glb" demo_content/models/Fox.glb
          dl "$base/DamagedHelmet/glTF-Binary/DamagedHelmet.glb" demo_content/models/DamagedHelmet.glb
          echo "Demo assets embutíveis:"
          ls -la demo_content/models/ 2>/dev/null || true

      - name: Configurar (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DKZ_EMBED_DEMO_DIR=${{ github.workspace }}/demo_content

      - name: Compilar
        run: cmake --build build --config Release --parallel

      
      
      
      
      - name: Baixar Content Pack (CC0)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set +e
          mkdir -p content/models content/skies content/textures content/Prefabs
          manifest="content/MANIFEST.txt"
          : > "$manifest"
          dl() {
            curl -fsSL --max-time 60 -o "$2" "$1" 2>/dev/null
            if [ -s "$2" ]; then printf '%-32s %10s bytes\n' "$3" "$(wc -c < "$2")" >> "$manifest"; else rm -f "$2"; fi
          }
          base="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0"
          
          dl "$base/Fox/glTF-Binary/Fox.glb"                    content/models/Fox.glb                    Fox.glb
          dl "$base/BoxAnimated/glTF-Binary/BoxAnimated.glb"    content/models/BoxAnimated.glb            BoxAnimated.glb
          dl "$base/BrainStem/glTF-Binary/BrainStem.glb"        content/models/BrainStem.glb              BrainStem.glb
          dl "$base/CesiumMan/glTF-Binary/CesiumMan.glb"        content/models/CesiumMan.glb              CesiumMan.glb
          dl "$base/RiggedFigure/glTF-Binary/RiggedFigure.glb"  content/models/RiggedFigure.glb           RiggedFigure.glb
          dl "$base/SimpleSkin/glTF-Binary/SimpleSkin.glb"      content/models/SimpleSkin.glb              SimpleSkin.glb
          
          dl "$base/DamagedHelmet/glTF-Binary/DamagedHelmet.glb" content/models/DamagedHelmet.glb         DamagedHelmet.glb
          dl "$base/Avocado/glTF-Binary/Avocado.glb"            content/models/Avocado.glb                 Avocado.glb
          dl "$base/BoomBox/glTF-Binary/BoomBox.glb"            content/models/BoomBox.glb                 BoomBox.glb
          dl "$base/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb" content/models/CesiumMilkTruck.glb   CesiumMilkTruck.glb
          dl "$base/SimpleMaterials/glTF-Binary/SimpleMaterials.glb" content/models/SimpleMaterials.glb   SimpleMaterials.glb
          dl "$base/Duck/glTF-Binary/Duck.glb"                  content/models/Duck.glb                    Duck.glb
          dl "$base/Character/glTF-Binary/Character.glb"        content/models/Character.glb              Character.glb
          dl "$base/ReciprocatingSaw/glTF-Binary/ReciprocatingSaw.glb" content/models/ReciprocatingSaw.glb ReciprocatingSaw.glb
          
          sky="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k"
          dl "$sky/qwantani_puresky_1k.hdr"                     content/skies/qwantani_puresky_1k.hdr     qwantani_puresky_1k.hdr
          dl "$sky/kloofendal_48d_partly_cloudy_puresky_1k.hdr" content/skies/kloofendal_1k.hdr          kloofendal_1k.hdr
          dl "$sky/venice_sunset_1k.hdr"                        content/skies/venice_sunset_1k.hdr        venice_sunset_1k.hdr
          dl "$sky/the_sky_is_on_fire_1k.hdr"                   content/skies/the_sky_is_on_fire_1k.hdr   the_sky_is_on_fire_1k.hdr
          dl "$sky/studio_small_03_1k.hdr"                      content/skies/studio_small_03_1k.hdr      studio_small_03_1k.hdr
          dl "$sky/spruit_sunrise_1k.hdr"                       content/skies/spruit_sunrise_1k.hdr       spruit_sunrise_1k.hdr
          sky4="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/4k"
          dl "$sky4/qwantani_puresky_4k.hdr"                    content/skies/qwantani_puresky_4k.hdr     qwantani_puresky_4k.hdr
          dl "$sky4/venice_sunset_4k.hdr"                       content/skies/venice_sunset_4k.hdr        venice_sunset_4k.hdr
          
          if [ -d "content/Prefabs" ]; then cp content/Prefabs/*.kzprefab content/Prefabs/ 2>/dev/null || true; fi
          echo "---- Content Pack: $(grep -c . "$manifest") arquivos ----" >> "$manifest"
          cat "$manifest"

      - name: Empacotar executáveis da engine
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          
          
          
          mkdir -p release/bin
          cp -r build/bin/* release/bin/
          
          
          
          
          
          mkdir -p release/bin/managed/Kizuri.Scripting
          cp managed/Kizuri.Scripting.dll release/bin/managed/Kizuri.Scripting.dll
          cp managed/Kizuri.Scripting/Kizuri.Scripting.csproj release/bin/managed/Kizuri.Scripting/Kizuri.Scripting.csproj
          
          
          if [ ! -f release/bin/managed/Kizuri.Scripting.dll ] && [ -d managed/Kizuri.Scripting ]; then
            cp -r managed release/bin/managed
          fi
          
          
          
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mkdir -p release/share/applications release/share/icons/hicolor/256x256/apps
            cp packaging/icons/kizuri-torii-256.png release/share/icons/hicolor/256x256/apps/kizuri-torii.png
            cp packaging/linux/kizuri-editor.desktop release/share/applications/
          fi
          
          
          
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd release && powershell -Command "Compress-Archive -Path * -DestinationPath ../KizuriGame-${{ matrix.os }}-x86_64.zip -Force")
          else
            (cd release && zip -qr "../KizuriGame-${{ matrix.os }}-x86_64.zip" .)
          fi

      - name: Empacotar Content Pack (separado do zip da engine)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -d content ]; then
            (cd content && zip -qr "../KizuriEngine-Content-Pack.zip" .)
            echo "Content Pack pronto:"
            ls -la KizuriEngine-Content-Pack.zip
          else
            echo "::warning::Sem pasta content/ — Content Pack não gerado."
          fi

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KizuriGame-${{ matrix.os }}-x86_64.zip
          generate_release_notes: true

      - name: Publicar Content Pack na Release (uma vez)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: KizuriEngine-Content-Pack.zip
          generate_release_notes: false

  
  managed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: managed

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Kizuri.Scripting
        run: dotnet build Kizuri.Scripting/Kizuri.Scripting.csproj -c Release --nologo

      - name: Compilar jogo de exemplo (SampleGame)
        run: dotnet build SampleGame/SampleGame.csproj -c Release --nologo

      - name: Montar artifact combinado (scripting + SampleGame)
        shell: bash
        run: |
          mkdir -p artifacts
          cp Kizuri.Scripting/bin/Release/net10.0/* artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.dll artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.runtimeconfig.json artifacts/ 2>/dev/null || true
          cp SampleGame/bin/Release/net10.0/SampleGame.deps.json artifacts/ 2>/dev/null || true

      - name: Empacotar o assembly C# (release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd artifacts && powershell -Command "Compress-Archive -Path * -DestinationPath ../Kizuri.Managed-${{ matrix.os }}.zip -Force")
          else
            (cd artifacts && zip -qr "../Kizuri.Managed-${{ matrix.os }}.zip" .)
          fi

      - name: Publicar na Release (managed)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: managed/Kizuri.Managed-${{ matrix.os }}.zip

  
  
  
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências (ninja, JDK p/ keytool, zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zip default-jdk-headless

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache do FetchContent (_deps do Android)
        uses: actions/cache@v4
        with:
          path: build-android/_deps
          key: android-kizuri-deps-${{ hashFiles('CMakeLists.txt', 'engine/CMakeLists.txt') }}
          restore-keys: |
            android-kizuri-deps-

      - name: Cache de compilação (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "1G"
          key: android

      - name: Cache de pacotes NuGet (runtime pack android-arm64)
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: android-nuget-${{ hashFiles('managed/**/*.csproj') }}
          restore-keys: |
            android-nuget-

      - name: Instalar NDK, build-tools e plataforma
        run: |
          
          
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          
          
          set +o pipefail
          "$SDKMANAGER" --install "platform-tools" "ndk;27.2.12479018" \
            "platforms;android-34" "build-tools;34.0.0" \
            || { echo "::error::sdkmanager --install falhou"; exit 1; }
          set -o pipefail
          
          
          for d in build-tools/34.0.0 ndk/27.2.12479018; do
            test -d "$ANDROID_HOME/$d" \
              || { echo "::error::$d não instalado em $ANDROID_HOME"; find "$ANDROID_HOME" -maxdepth 2 | head -20; exit 1; }
          done
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configurar (CMake/NDK)
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKZ_BUILD_EDITOR=OFF -DKZ_BUILD_SANDBOX=OFF -DKZ_BUILD_TESTS=OFF

      - name: Compilar (libKizuriGame.so + libKizuriEngine.so)
        run: cmake --build build-android --target KizuriGame --parallel

      - name: Publicar jogo C# pro Android (runtime CoreCLR + assemblies)
        run: |
          dotnet publish managed/SampleGame/SampleGame.csproj \
            -c Release -r android-arm64 --self-contained true \
            -o android_dotnet --nologo
          
          
          
          
          RPM_VER=$(grep -oE 'Microsoft\.NETCore\.App\.Runtime\.android-arm64/[0-9.]+' android_dotnet/SampleGame.deps.json | head -1 | cut -d/ -f2)
          test -n "$RPM_VER" || { echo "::error::versão do runtime pack não achada no deps.json"; exit 1; }
          echo "Baixando runtime pack $RPM_VER do NuGet..."
          curl -fsSL -o pack.nupkg \
            "https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.android-arm64/${RPM_VER}/microsoft.netcore.app.runtime.android-arm64.${RPM_VER}.nupkg"
          unzip -q -o pack.nupkg -d pack
          
          find pack -name "*.so" -o -name "System.Private.CoreLib.dll" | head -10
          cp -f pack/runtimes/android-arm64/native/*.so android_dotnet/
          cp -rf pack/runtimes/android-arm64/lib/.* android_dotnet/ 2>/dev/null || true
          
          
          test -f android_dotnet/libcoreclr.so \
            || { echo "::error::libcoreclr.so ausente no runtime pack"; exit 1; }
          echo "Runtime embutível pronto em android_dotnet/ ($RPM_VER)"
          ls android_dotnet

      - name: Empacotar APK (aapt2 + zipalign + apksigner)
        run: |
          chmod +x platform/android/package_apk.sh
          platform/android/package_apk.sh \
            "${{ github.workspace }}/build-android/bin" \
            "${{ github.workspace }}/android_dotnet" \
            "${{ github.workspace }}/content/game" \
            "$ANDROID_HOME/build-tools/34.0.0" \
            "${{ github.workspace }}/KizuriGame-android.apk"

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: KizuriGame-android-arm64
          path: KizuriGame-android.apk
          if-no-files-found: error

      - name: Publicar na Release (APK, push de tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KizuriGame-android.apk
          generate_release_notes: false

  
  
  
  linux-appimage:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache do FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: appimage-kizuri-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            appimage-kizuri-deps-

      - name: Cache de compilação (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: "1G"
          key: appimage

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools \
            xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libx11-dev libasound2-dev libssl-dev ninja-build zip

      - name: Configurar (CMake — só o jogo, sem editor)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DKZ_BUILD_EDITOR=OFF -DKZ_BUILD_SANDBOX=OFF -DKZ_BUILD_TESTS=OFF

      - name: Compilar (KizuriGame)
        run: cmake --build build --target KizuriGame --parallel

      - name: Gerar .AppImage
        run: |
          chmod +x platform/linux/make-appimage.sh
          platform/linux/make-appimage.sh \
            "${{ github.workspace }}/build/bin" \
            "${{ github.workspace }}/content/game" \
            "${{ github.workspace }}/KizuriGame-linux-x86_64.AppImage"

      - name: Upload do AppImage
        uses: actions/upload-artifact@v4
        with:
          name: KizuriGame-linux-x86_64.AppImage
          path: KizuriGame-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publicar na Release (AppImage, push de tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KizuriGame-linux-x86_64.AppImage
          generate_release_notes: false
