name: Build Kizuri Engine

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-latest
            preset: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libx11-dev libasound2-dev ninja-build

      - name: Instalar Ninja (Windows)
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache do FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-kizuri-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-kizuri-deps-

      - name: Configurar (CMake)
        # KZ_BUNDLE_DOTNET=OFF aqui: o runner já tem .NET pré-instalado e
        # copiar o SDK a cada build só atrasa. O .NET embutido entra no
        # artifact pelo job 'package' (que faz setup-dotnet e copia o SDK).
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKZ_BUNDLE_DOTNET=OFF

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar artefatos
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/bin/* dist/ || true

      - name: Publicar artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: KizuriEngine-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn

  # ------- Scripting C# (Kizuri.Scripting) -------
  # O motor é C++ privado; o jogo é um assembly .NET. Este job valida que o
  # assembly compila em ambos OS, e gera o artefato combinado (Kizuri.Scripting.dll
  # + SampleGame.dll) que o editor/export exemplo usa pra vincular um jogo.
  managed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: managed

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Kizuri.Scripting
        run: dotnet build Kizuri.Scripting/Kizuri.Scripting.csproj -c Release --nologo

      - name: Compilar jogo de exemplo (SampleGame)
        run: dotnet build SampleGame/SampleGame.csproj -c Release --nologo

      - name: Montar artifact combinado (scripting + SampleGame)
        shell: bash
        run: |
          mkdir -p artifacts
          cp Kizuri.Scripting/bin/Release/net10.0/* artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.dll artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.runtimeconfig.json artifacts/ 2>/dev/null || true
          cp SampleGame/bin/Release/net10.0/SampleGame.deps.json artifacts/ 2>/dev/null || true

      - name: Publicar artefato combinado managed
        uses: actions/upload-artifact@v4
        with:
          name: Kizuri.Managed-${{ matrix.os }}
          path: managed/artifacts/
          if-no-files-found: warn

  # ------- Empacotamento combinado -------
  # Baixa os artefatos de build e managed de cada OS e gera um único zip
  # organizado: bin/ com os executáveis + DLL da engine + runtime MinGW,
  # e managed/ com o assembly Kizuri.Scripting.dll e seus deps.
  package:
    needs: [build, managed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download do artefato da engine
        uses: actions/download-artifact@v4
        with:
          name: KizuriEngine-${{ matrix.os }}
          path: staging/engine

      - name: Download do artefato managed
        uses: actions/download-artifact@v4
        with:
          name: Kizuri.Managed-${{ matrix.os }}
          path: staging/managed

      - name: Organizar estrutura
        shell: bash
        run: |
          mkdir -p dist/bin dist/managed
          mv staging/engine/* dist/bin/
          mv staging/managed/* dist/managed/

      - name: Configurar .NET SDK 10 (pra embutir no artifact)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A engine é distribuída self-contained: o SDK .NET inteiro vai dentro
      # de bin/dotnet/ do zip — o usuário roda o editor e compila/publica
      # jogos C# sem instalar o .NET. (CoreCLRHost procura o hostfxr embutido
      # e o GameExporter usa o dotnet embutido.)
      - name: Embutir .NET no artifact
        shell: bash
        run: |
          cp -r "$DOTNET_ROOT" dist/bin/dotnet
          echo "SDK .NET embutido em dist/bin/dotnet ($(du -sh dist/bin/dotnet | cut -f1))"

      - name: Publicar artefato combinado
        uses: actions/upload-artifact@v4
        with:
          name: Kizuri-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn