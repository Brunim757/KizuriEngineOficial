name: Build Kizuri Engine

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows
          - os: ubuntu-latest
            preset: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de sistema (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorg-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libx11-dev libasound2-dev ninja-build

      - name: Instalar Ninja (Windows)
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Cache do FetchContent (_deps)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-kizuri-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-kizuri-deps-

      - name: Configurar (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar artefatos
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/bin/* dist/ || true

      - name: Publicar artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: KizuriEngine-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn

  # ------- Scripting C# (Kizuri.Scripting) -------
  # O motor é C++ privado; o jogo é um assembly .NET. Este job valida que o
  # assembly compila em ambos OS, e gera o artefato combinado (Kizuri.Scripting.dll
  # + SampleGame.dll) que o editor/export exemplo usa pra vincular um jogo.
  managed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: managed

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Kizuri.Scripting
        run: dotnet build Kizuri.Scripting/Kizuri.Scripting.csproj -c Release --nologo

      - name: Compilar jogo de exemplo (SampleGame)
        run: dotnet build SampleGame/SampleGame.csproj -c Release --nologo

      - name: Montar artifact combinado (scripting + SampleGame)
        shell: bash
        run: |
          mkdir -p artifacts
          cp Kizuri.Scripting/bin/Release/net10.0/* artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.dll artifacts/
          cp SampleGame/bin/Release/net10.0/SampleGame.runtimeconfig.json artifacts/ 2>/dev/null || true
          cp SampleGame/bin/Release/net10.0/SampleGame.deps.json artifacts/ 2>/dev/null || true

      - name: Publicar artefato combinado managed
        uses: actions/upload-artifact@v4
        with:
          name: Kizuri.Managed-${{ matrix.os }}
          path: managed/artifacts/
          if-no-files-found: warn

  # ------- Empacotamento combinado -------
  # Baixa os artefatos de build e managed de cada OS e gera um único zip
  # organizado: bin/ com os executáveis + DLL da engine + runtime MinGW,
  # e managed/ com o assembly Kizuri.Scripting.dll e seus deps.
  package:
    needs: [build, managed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download do artefato da engine
        uses: actions/download-artifact@v4
        with:
          name: KizuriEngine-${{ matrix.os }}
          path: staging/engine

      - name: Download do artefato managed
        uses: actions/download-artifact@v4
        with:
          name: Kizuri.Managed-${{ matrix.os }}
          path: staging/managed

      - name: Organizar estrutura
        shell: bash
        run: |
          mkdir -p dist/bin dist/managed
          mv staging/engine/* dist/bin/
          mv staging/managed/* dist/managed/

      # ---- Content Pack (assets CC0 reais, download na CI) -------------------
      # Modelos glTF (glTF-Sample-Models/Khronos) e HDRIs (Poly Haven) entram
      # no zip como conteúdo de exemplo USÁVEL: o BoxAnimated/Fox têm skin +
      # animações (valida o Animator do editor) e os .hdr alimentam o céu
      # HDRI/IBL. Tudo best-effort: se um download falhar, só falta aquele
      # arquivo — nunca quebra o build. O MANIFEST registra o que veio.
      - name: Baixar Content Pack (CC0)
        shell: bash
        run: |
          set +e
          mkdir -p dist/content/models dist/content/skies dist/content/audio
          manifest="dist/content/MANIFEST.txt"
          : > "$manifest"
          dl() { # $1=url $2=destino $3=nome
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL --max-time 60 -o "$2" "$1" 2>/dev/null
            else
              wget -q -O "$2" "$1" 2>/dev/null
            fi
            if [ -s "$2" ]; then
              size=$(wc -c < "$2")
              printf '%-28s %10s bytes\n' "$3" "$size" >> "$manifest"
            else
              rm -f "$2"
            fi
          }
          base="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0"
          dl "$base/Fox/glTF-Binary/Fox.glb"                    dist/content/models/Fox.glb                    Fox.glb
          dl "$base/BoxAnimated/glTF-Binary/BoxAnimated.glb"    dist/content/models/BoxAnimated.glb            BoxAnimated.glb
          dl "$base/DamagedHelmet/glTF-Binary/DamagedHelmet.glb" dist/content/models/DamagedHelmet.glb         DamagedHelmet.glb
          dl "$base/Avocado/glTF-Binary/Avocado.glb"            dist/content/models/Avocado.glb                Avocado.glb
          dl "$base/BoomBox/glTF-Binary/BoomBox.glb"            dist/content/models/BoomBox.glb                BoomBox.glb
          dl "$base/Duck/glTF-Binary/Duck.glb"                  dist/content/models/Duck.glb                    Duck.glb
          dl "$base/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb" dist/content/models/CesiumMilkTruck.glb    CesiumMilkTruck.glb
          dl "$base/SimpleMaterials/glTF-Binary/SimpleMaterials.glb" dist/content/models/SimpleMaterials.glb    SimpleMaterials.glb
          sky="https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k"
          dl "$sky/qwantani_puresky_1k.hdr"                     dist/content/skies/qwantani_puresky_1k.hdr     qwantani_puresky.hdr
          dl "$sky/kloofendal_48d_partly_cloudy_puresky_1k.hdr" dist/content/skies/kloofendal_1k.hdr          kloofendal_partly_cloudy.hdr
          dl "$sky/spruit_sunrise_1k.hdr"                       dist/content/skies/spruit_sunrise_1k.hdr       spruit_sunrise.hdr
          dl "$sky/venice_sunset_1k.hdr"                        dist/content/skies/venice_sunset_1k.hdr        venice_sunset.hdr
          total=0; while read -r _ s _; do total=$((total + ${s:-0})); done < "$manifest"
          echo "---- Content Pack: $(grep -c . "$manifest") arquivos, ~$((total/1024)) KB ----" >> "$manifest"
          echo "Manifest:"
          cat "$manifest"

      - name: Publicar artefato combinado
        uses: actions/upload-artifact@v4
        with:
          name: Kizuri-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn